name = "flowcus-relay"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Minimum client app version that may use the relay. Raise it only after the
# matching release is live, or you lock users out before the update exists.
[vars]
MIN_APP = "5.0.0"
PROTO = "2"
RELAY_DISABLED = "false"

# Secret: `npx wrangler secret put IP_SECRET` (any long random string).

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Directory", "Room"]
